<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#00ad50">
<title>Toko Sembako Hj Heni</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7f5;color:#222}
body{padding-bottom:115px}
.hero{
  background:linear-gradient(135deg,#009b4d,#00b84f);
  color:white;text-align:center;padding:38px 18px 42px;
  border-radius:0 0 42px 42px;box-shadow:0 4px 16px #0002
}
.hero h1{font-size:31px;margin:0 0 12px}
.hero p{font-size:18px;margin:8px 0}
.container{max-width:900px;margin:auto;padding:20px 15px}
.search{
  width:100%;border:0;outline:0;background:white;border-radius:22px;
  padding:19px 22px;font-size:19px;box-shadow:0 4px 18px #00000012
}
.categories{
  display:flex;gap:10px;overflow-x:auto;padding:18px 0 14px;
  scrollbar-width:none
}
.categories::-webkit-scrollbar{display:none}
.category{
  border:0;background:#fff;border-radius:30px;padding:14px 21px;
  font-size:17px;white-space:nowrap;box-shadow:0 3px 12px #00000012
}
.category.active{background:#00ad50;color:white}
#status{text-align:center;color:#777;min-height:22px;margin:5px 0 14px}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.product{
  background:white;border-radius:21px;padding:13px;
  box-shadow:0 4px 15px #0000000d
}
.product-image{
  width:100%;height:135px;border-radius:16px;background:#eef2f0;
  display:flex;align-items:center;justify-content:center;font-size:56px;
  overflow:hidden
}
.product-image img{width:100%;height:100%;object-fit:cover}
.product h3{font-size:18px;margin:12px 2px 6px}
.price{color:#009b4d;font-size:19px;font-weight:bold}
.stock{color:#777;font-size:13px;margin:6px 2px 10px}
.add{
  width:100%;border:0;border-radius:13px;padding:12px;
  background:#00ad50;color:white;font-size:16px;font-weight:bold
}
.add:disabled{background:#aaa}
.empty{
  grid-column:1/-1;background:white;border-radius:22px;
  padding:55px 15px;text-align:center;color:#777;font-size:19px
}
.cartbar{
  position:fixed;left:15px;right:15px;bottom:14px;z-index:50;
  background:#0b2115;color:white;border-radius:24px;padding:13px 15px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 8px 30px #0006
}
.cart-count{font-size:16px}
.cart-total{font-size:22px;font-weight:bold;margin-top:3px}
.checkout{
  border:0;background:#00c853;color:white;border-radius:17px;
  padding:15px 25px;font-size:18px;font-weight:bold
}
.modal{
  display:none;position:fixed;inset:0;background:#0009;z-index:100;
  padding:18px
}
.modal-box{
  background:white;max-width:600px;margin:35px auto;border-radius:23px;
  padding:20px;max-height:82vh;overflow:auto
}
.close{
  float:right;border:0;background:#eee;width:36px;height:36px;
  border-radius:50%;font-size:18px
}
.modal-box h2{margin-top:0}
.cart-row{
  display:flex;justify-content:space-between;gap:12px;
  padding:13px 0;border-bottom:1px solid #eee
}
.qty button{
  border:0;background:#eee;border-radius:9px;padding:7px 11px;
  font-size:16px
}
.order{
  width:100%;margin-top:18px;border:0;border-radius:14px;
  padding:15px;background:#00ad50;color:white;font-size:18px;font-weight:bold
}
@media(max-width:500px){
  .hero h1{font-size:28px}
  .hero p{font-size:16px}
  .product-image{height:110px}
  .products{gap:11px}
  .product h3{font-size:16px}
  .price{font-size:17px}
  .checkout{padding:14px 19px}
}
</style>
</head>

<body>

<header class="hero">
  <h1>🛒 Toko Sembako Hj Heni</h1>
  <p>Belanja kebutuhan harian dengan mudah</p>
  <p>📍 Jln Raya Labuan KM.12, Cipeucang, Pandeglang</p>
  <p>🕐 Buka 06.00 - 21.00</p>
</header>

<main class="container">

  <input id="search" class="search" type="search"
         placeholder="🔎 Cari produk..." autocomplete="off">

  <div id="categories" class="categories"></div>

  <div id="status">Memuat produk...</div>

  <section id="products" class="products"></section>

</main>

<div class="cartbar">
  <div>
    <div class="cart-count">🛒 <span id="cartCount">0</span> barang</div>
    <div id="cartTotal" class="cart-total">Rp0</div>
  </div>
  <button class="checkout" onclick="openCart()">Checkout</button>
</div>

<div id="cartModal" class="modal" onclick="closeOutside(event)">
  <div class="modal-box">
    <button class="close" onclick="closeCart()">✕</button>
    <h2>🛒 Keranjang Belanja</h2>
    <div id="cartList"></div>
    <button class="order" onclick="sendWhatsApp()">Pesan lewat WhatsApp</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ================================
   PENGATURAN TOKO
================================ */
const SUPABASE_URL = "https://cmdktosufdhbiziacrio.supabase.co";
const SUPABASE_KEY = "sb_publishable_hh2tGhNKs-cq5E2ELjjU7w_aej9SLma";
const WHATSAPP_NUMBER = "6283897619776";

const supabaseClient =
  window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let products = [];
let cart = {};
let selectedCategory = "Semua";

/* ================================
   FORMAT HARGA
================================ */
function rupiah(number){
  return "Rp" + Number(number || 0).toLocaleString("id-ID");
}

/* ================================
   KEAMANAN TEKS HTML
================================ */
function safeText(value){
  return String(value ?? "").replace(/[&<>"']/g,function(char){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[char];
  });
}

/* ================================
   KATEGORI PRODUK
================================ */
function makeCategory(name){
  const text = String(name || "").toLowerCase();

  if(text.includes("beras")) return "Beras";
  if(text.includes("minyak")) return "Minyak";
  if(text.includes("gula")) return "Gula";
  if(text.includes("telur")) return "Telur";
  if(text.includes("mie") || text.includes("mi ")) return "Mie";

  return "Lainnya";
}

function renderCategories(){
  const categories = ["Semua"];

  products.forEach(function(product){
    if(!categories.includes(product.category)){
      categories.push(product.category);
    }
  });

  const box = document.getElementById("categories");

  box.innerHTML = categories.map(function(category){
    let icon = "";
    if(category === "Beras") icon = "🍚 ";
    if(category === "Minyak") icon = "🛢️ ";
    if(category === "Gula") icon = "🍬 ";
    if(category === "Telur") icon = "🥚 ";
    if(category === "Mie") icon = "🍜 ";
    if(category === "Lainnya") icon = "🛍️ ";

    return `
      <button class="category ${category === selectedCategory ? "active" : ""}"
              onclick="selectCategory('${safeText(category)}')">
        ${icon}${safeText(category)}
      </button>
    `;
  }).join("");
}

function selectCategory(category){
  selectedCategory = category;
  renderCategories();
  renderProducts();
}

/* ================================
   AMBIL PRODUK DARI SUPABASE
================================ */
async function loadProducts(){

  const status = document.getElementById("status");

  try{

    const result = await supabaseClient
      .from("products")
      .select("id,name,price,stock,satuan,image_url,description,active")
      .eq("active", true)
      .order("id", {ascending:true});

    if(result.error){
      console.error("Supabase error:", result.error);
      status.textContent = "Gagal mengambil produk dari database.";
      products = [];
      renderProducts();
      return;
    }

    products = (result.data || []).map(function(item){

      return {
        id:item.id,
        name:item.name || "Produk",
        price:Number(item.price) || 0,
        stock:Number(item.stock) || 0,
        satuan:item.satuan || "pcs",
        image_url:item.image_url || "",
        description:item.description || "",
        category:makeCategory(item.name)
      };

    });

    status.textContent =
      products.length ? products.length + " produk tersedia" : "";

    renderCategories();
    renderProducts();
    updateCart();

  }catch(error){

    console.error(error);
    status.textContent = "Terjadi kesalahan saat memuat produk.";

  }
}

/* ================================
   TAMPILKAN PRODUK
================================ */
function renderProducts(){

  const keyword =
    document.getElementById("search").value.toLowerCase().trim();

  const box = document.getElementById("products");

  const filtered = products.filter(function(product){

    const name =
      String(product.name || "").toLowerCase();

    const description =
      String(product.description || "").toLowerCase();

    const searchOK =
      name.includes(keyword) ||
      description.includes(keyword);

    const categoryOK =
      selectedCategory === "Semua" ||
      product.category === selectedCategory;

    return searchOK && categoryOK;
  });

  if(!filtered.length){

    box.innerHTML = `
      <div class="empty">
        🔎<br><br>
        Produk tidak ditemukan.
      </div>
    `;

    return;
  }

  box.innerHTML = filtered.map(function(product){

    const quantity = cart[product.id] || 0;
    const stock = Number(product.stock) || 0;
    const outOfStock = stock <= 0;

    let imageHTML = "🛍️";

    if(product.image_url){
      imageHTML =
        `<img src="${safeText(product.image_url)}"
              alt="${safeText(product.name)}"
              onerror="this.remove()">`;
    }

    return `
      <article class="product">

        <div class="product-image">
          ${imageHTML}
        </div>

        <h3>${safeText(product.name)}</h3>

        <div class="price">
          ${rupiah(product.price)} / ${safeText(product.satuan)}
        </div>

        <div class="stock">
          ${outOfStock
            ? "Stok habis"
            : "Stok: " + stock + " " + safeText(product.satuan)}
        </div>

        <button class="add"
                ${outOfStock ? "disabled" : ""}
                onclick="addToCart(${Number(product.id)})">

          ${outOfStock
            ? "Stok Habis"
            : quantity > 0
              ? "Tambah Lagi (" + quantity + ")"
              : "Tambah"}

        </button>

      </article>
    `;

  }).join("");
}

/* ================================
   KERANJANG
================================ */
function addToCart(id){

  const product =
    products.find(function(item){
      return Number(item.id) === Number(id);
    });

  if(!product) return;

  const current = cart[id] || 0;

  if(current >= Number(product.stock)){
    alert("Jumlah melebihi stok yang tersedia.");
    return;
  }

  cart[id] = current + 1;

  renderProducts();
  updateCart();
}

function removeFromCart(id){

  if(!cart[id]) return;

  cart[id]--;

  if(cart[id] <= 0){
    delete cart[id];
  }

  renderProducts();
  updateCart();
  openCart();
}

function updateCart(){

  let count = 0;
  let total = 0;

  Object.keys(cart).forEach(function(id){

    const product =
      products.find(function(item){
        return String(item.id) === String(id);
      });

    if(!product) return;

    count += cart[id];
    total += cart[id] * product.price;
  });

  document.getElementById("cartCount").textContent = count;
  document.getElementById("cartTotal").textContent = rupiah(total);
}

/* ================================
   CHECKOUT
================================ */
function openCart(){

  const list = document.getElementById("cartList");
  const ids = Object.keys(cart);

  if(!ids.length){

    list.innerHTML = `
      <div class="empty">
        🛒<br><br>
        Keranjang masih kosong.
      </div>
    `;

  }else{

    list.innerHTML = ids.map(function(id){

      const product =
        products.find(function(item){
          return String(item.id) === String(id);
        });

      if(!product) return "";

      const quantity = cart[id];
      const subtotal = quantity * product.price;

      return `
        <div class="cart-row">

          <div>
            <b>${safeText(product.name)}</b><br>
            ${rupiah(product.price)} × ${quantity}
            = <b>${rupiah(subtotal)}</b>
          </div>

          <div>
            <button class="qty button"
                    onclick="removeFromCart(${Number(id)})">−</button>
            <b>${quantity}</b>
            <button class="qty button"
                    onclick="addToCart(${Number(id)})">+</button>
          </div>

        </div>
      `;

    }).join("");
  }

  document.getElementById("cartModal").style.display = "block";
}

function closeCart(){
  document.getElementById("cartModal").style.display = "none";
}

function closeOutside(event){
  if(event.target.id === "cartModal"){
    closeCart();
  }
}

/* ================================
   WHATSAPP
================================ */
function sendWhatsApp(){

  const ids = Object.keys(cart);

  if(!ids.length){
    alert("Keranjang masih kosong.");
    return;
  }

  let message =
    "Halo Toko Sembako Hj Heni, saya ingin memesan:%0A%0A";

  let total = 0;

  ids.forEach(function(id){

    const product =
      products.find(function(item){
        return String(item.id) === String(id);
      });

    if(!product) return;

    const quantity = cart[id];
    const subtotal = quantity * product.price;

    total += subtotal;

    message +=
      "• " +
      encodeURIComponent(product.name) +
      " x" +
      quantity +
      " = " +
      encodeURIComponent(rupiah(subtotal)) +
      "%0A";
  });

  message +=
    "%0ATotal: " +
    encodeURIComponent(rupiah(total)) +
    "%0A%0AMohon konfirmasi pesanan saya.";

  window.open(
    "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + message,
    "_blank"
  );
}

/* ================================
   PENCARIAN
================================ */
document.getElementById("search").addEventListener(
  "input",
  renderProducts
);

/* ================================
   MULAI
================================ */
loadProducts();

/* Update otomatis setiap 30 detik */
setInterval(loadProducts, 30000);
</script>

</body>
</html>

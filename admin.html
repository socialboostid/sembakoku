<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Toko Sembakoku</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
header{background:#166534;color:#fff;padding:18px;text-align:center}
.container{max-width:900px;margin:auto;padding:15px}
.card{background:#fff;border-radius:16px;padding:18px;margin:15px 0;box-shadow:0 3px 12px #0001}
h2{margin:0 0 15px;color:#166534}
input,textarea{width:100%;padding:13px;margin:6px 0;border:1px solid #d1d5db;border-radius:10px;font-size:15px}
textarea{min-height:90px}
button{border:0;border-radius:10px;padding:12px 15px;font-weight:bold;font-size:14px}
.primary{background:#16a34a;color:white;width:100%}
.blue{background:#2563eb;color:#fff}
.red{background:#dc2626;color:#fff}
.gray{background:#6b7280;color:#fff}
.hidden{display:none!important}
.login{max-width:430px;margin:50px auto;padding:15px}
.login .card{text-align:center}
.msg{padding:10px;border-radius:9px;margin:8px 0;font-size:14px}
.err{background:#fee2e2;color:#991b1b}
.ok{background:#dcfce7;color:#166534}
.preview{width:140px;height:140px;object-fit:cover;border-radius:12px;display:none;margin:10px auto}
.filebox{border:2px dashed #bbb;border-radius:12px;padding:14px;text-align:center;margin:10px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border-radius:12px;padding:14px;text-align:center}
.stat b{display:block;font-size:20px;color:#166534}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.product{display:flex;gap:12px;border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin:10px 0}
.product img{width:85px;height:85px;border-radius:10px;object-fit:cover;background:#eee}
.info{flex:1}
.info h3{margin:0 0 5px}
.price{color:#15803d;font-weight:bold}
.actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:#0008;display:none;overflow:auto;padding:15px;z-index:10}
.modalbox{max-width:520px;margin:30px auto;background:#fff;border-radius:16px;padding:18px}
@media(max-width:600px){
 .stats{gap:6px}.stat{font-size:12px}.stat b{font-size:17px}
 .product img{width:70px;height:70px}
 .top h2{font-size:18px}
}
</style>
</head>
<body>

<div id="loginPage" class="login">
  <div class="card">
    <div style="font-size:45px">🏪</div>
    <h2>Admin Sembakoku</h2>
    <div id="loginMsg"></div>
    <input id="email" type="email" placeholder="Email admin">
    <input id="password" type="password" placeholder="Password">
    <button class="primary" onclick="login()">🔐 Masuk</button>
  </div>
</div>

<div id="app" class="hidden">
<header>
  <h1 style="margin:0">🏪 Admin Sembakoku</h1>
  <div style="margin-top:5px;font-size:13px">Kelola produk dari HP</div>
</header>

<div class="container">

  <div class="top" style="margin-top:10px">
    <h2>📦 Kelola Produk</h2>
    <button class="gray" onclick="logout()">Keluar</button>
  </div>

  <div class="stats">
    <div class="stat"><b id="totalProduk">0</b>Produk</div>
    <div class="stat"><b id="totalStok">0</b>Stok</div>
    <div class="stat"><b id="nilaiStok">Rp0</b>Nilai stok</div>
  </div>

  <div class="card">
    <h2>➕ Tambah Produk</h2>
    <input id="name" placeholder="Nama produk, contoh: Beras 5 Kg">
    <input id="price" type="number" min="0" placeholder="Harga, contoh: 75000">
    <input id="stock" type="number" min="0" placeholder="Stok, contoh: 50">
    <input id="description" placeholder="Deskripsi, contoh: Beras kualitas bagus">

    <div class="filebox">
      <b>📷 Foto Produk</b>
      <div style="font-size:13px;color:#666;margin:6px">Pilih foto langsung dari galeri HP</div>
      <input id="photo" type="file" accept="image/*" onchange="previewAdd(event)">
      <img id="addPreview" class="preview">
    </div>

    <button id="addBtn" class="primary" onclick="addProduct()">➕ Tambahkan Produk</button>
  </div>

  <div class="card">
    <h2>📋 Daftar Produk</h2>
    <input id="search" placeholder="🔎 Cari produk..." oninput="render()">
    <div id="list">Memuat...</div>
  </div>
</div>
</div>

<div id="editModal" class="modal">
  <div class="modalbox">
    <h2>✏️ Edit Produk</h2>
    <input id="editName" placeholder="Nama produk">
    <input id="editPrice" type="number" min="0" placeholder="Harga">
    <input id="editStock" type="number" min="0" placeholder="Stok">
    <input id="editDescription" placeholder="Deskripsi">

    <div class="filebox">
      <b>📷 Ganti Foto</b>
      <input id="editPhoto" type="file" accept="image/*" onchange="previewEdit(event)">
      <img id="editPreview" class="preview">
    </div>

    <button class="primary" onclick="saveEdit()">💾 Simpan</button>
    <button class="gray" style="width:100%;margin-top:8px" onclick="closeEdit()">Batal</button>
  </div>
</div>

<script>
const SUPABASE_URL="https://cmdktosufdhbiziacrio.supabase.co";
const SUPABASE_KEY="sb_publishable_hh2tGhNKs-cq5E2ELjjU7w_aej9SLma";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let products=[];
let editing=null;

function money(n){
  return "Rp"+Number(n||0).toLocaleString("id-ID");
}

function esc(v){
  const d=document.createElement("div");
  d.textContent=v??"";
  return d.innerHTML;
}

async function checkSession(){
  const {data}=await db.auth.getSession();
  if(data.session) showApp();
}

async function login(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const msg=document.getElementById("loginMsg");

  if(!email||!password){
    msg.innerHTML='<div class="msg err">Email dan password wajib diisi.</div>';
    return;
  }

  msg.innerHTML='<div class="msg ok">Sedang masuk...</div>';

  const {error}=await db.auth.signInWithPassword({email,password});

  if(error){
    msg.innerHTML='<div class="msg err">'+esc(error.message)+'</div>';
    return;
  }

  showApp();
}

function showApp(){
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  loadProducts();
}

async function logout(){
  await db.auth.signOut();
  location.reload();
}

async function loadProducts(){
  const {data,error}=await db.from("products").select("*").order("id",{ascending:false});
  if(error){
    document.getElementById("list").innerHTML='<div class="msg err">'+esc(error.message)+'</div>';
    return;
  }
  products=data||[];
  render();
}

function render(){
  const q=document.getElementById("search").value.toLowerCase().trim();
  const list=document.getElementById("list");
  const rows=products.filter(p=>String(p.name||"").toLowerCase().includes(q));

  if(!rows.length){
    list.innerHTML='<div style="text-align:center;padding:25px;color:#777">Belum ada produk.</div>';
  }else{
    list.innerHTML=rows.map(p=>{
      const img=p.image_url||"https://placehold.co/150x150?text=Produk";
      return `
      <div class="product">
        <img src="${esc(img)}" onerror="this.src='https://placehold.co/150x150?text=Produk'">
        <div class="info">
          <h3>${esc(p.name)}</h3>
          <div class="price">${money(p.price)}</div>
          <div>Stok: ${Number(p.stock||0)}</div>
          <div style="font-size:13px;color:#666;margin-top:3px">${esc(p.description||"")}</div>
          <div class="actions">
            <button class="blue" onclick="openEdit(${JSON.stringify(String(p.id))})">✏️ Edit</button>
            <button class="red" onclick="deleteProduct(${JSON.stringify(String(p.id))})">🗑️ Hapus</button>
          </div>
        </div>
      </div>`;
    }).join("");
  }

  document.getElementById("totalProduk").textContent=products.length;
  document.getElementById("totalStok").textContent=products.reduce((a,p)=>a+Number(p.stock||0),0);
  document.getElementById("nilaiStok").textContent=money(products.reduce((a,p)=>a+Number(p.stock||0)*Number(p.price||0),0));
}

function previewAdd(e){
  const f=e.target.files[0], img=document.getElementById("addPreview");
  if(!f){img.style.display="none";return;}
  img.src=URL.createObjectURL(f);
  img.style.display="block";
}

function previewEdit(e){
  const f=e.target.files[0], img=document.getElementById("editPreview");
  if(!f){img.style.display="none";return;}
  img.src=URL.createObjectURL(f);
  img.style.display="block";
}

async function uploadImage(file){
  if(!file) return null;
  if(!file.type.startsWith("image/")) throw new Error("File harus berupa gambar.");
  if(file.size>5*1024*1024) throw new Error("Ukuran foto maksimal 5 MB.");

  const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
  const path="products/"+Date.now()+"-"+crypto.randomUUID()+"."+ext;

  const {error}=await db.storage.from("product-images").upload(path,file,{
    cacheControl:"3600",
    upsert:false
  });

  if(error) throw error;

  const {data}=db.storage.from("product-images").getPublicUrl(path);
  return data.publicUrl;
}

async function addProduct(){
  const btn=document.getElementById("addBtn");
  const name=document.getElementById("name").value.trim();
  const price=Number(document.getElementById("price").value);
  const stock=Number(document.getElementById("stock").value);
  const description=document.getElementById("description").value.trim();
  const file=document.getElementById("photo").files[0];

  if(!name){alert("Nama produk wajib diisi.");return;}
  if(!Number.isFinite(price)||price<0){alert("Harga tidak valid.");return;}
  if(!Number.isInteger(stock)||stock<0){alert("Stok harus angka 0 atau lebih.");return;}

  try{
    btn.disabled=true;
    btn.textContent="⏳ Menyimpan...";

    let image_url=null;
    if(file) image_url=await uploadImage(file);

    const {error}=await db.from("products").insert({
      name,price,stock,description,image_url,active:true
    });

    if(error) throw error;

    alert("Produk berhasil ditambahkan ✅");

    document.getElementById("name").value="";
    document.getElementById("price").value="";
    document.getElementById("stock").value="";
    document.getElementById("description").value="";
    document.getElementById("photo").value="";
    document.getElementById("addPreview").style.display="none";

    await loadProducts();
  }catch(e){
    alert("Gagal menambahkan produk:\n"+e.message);
  }finally{
    btn.disabled=false;
    btn.textContent="➕ Tambahkan Produk";
  }
}

function openEdit(id){
  editing=products.find(p=>String(p.id)===String(id));
  if(!editing){alert("Produk tidak ditemukan.");return;}

  document.getElementById("editName").value=editing.name||"";
  document.getElementById("editPrice").value=editing.price||0;
  document.getElementById("editStock").value=editing.stock||0;
  document.getElementById("editDescription").value=editing.description||"";
  document.getElementById("editPhoto").value="";
  document.getElementById("editPreview").style.display="none";
  document.getElementById("editModal").style.display="block";
}

function closeEdit(){
  document.getElementById("editModal").style.display="none";
  editing=null;
}

async function saveEdit(){
  if(!editing)return;

  const name=document.getElementById("editName").value.trim();
  const price=Number(document.getElementById("editPrice").value);
  const stock=Number(document.getElementById("editStock").value);
  const description=document.getElementById("editDescription").value.trim();
  const file=document.getElementById("editPhoto").files[0];

  if(!name){alert("Nama produk wajib diisi.");return;}
  if(!Number.isFinite(price)||price<0){alert("Harga tidak valid.");return;}
  if(!Number.isInteger(stock)||stock<0){alert("Stok harus angka 0 atau lebih.");return;}

  try{
    let image_url=editing.image_url||null;
    if(file) image_url=await uploadImage(file);

    const {error}=await db.from("products").update({
      name,price,stock,description,image_url
    }).eq("id",editing.id);

    if(error)throw error;

    alert("Produk berhasil diperbarui ✅");
    closeEdit();
    await loadProducts();
  }catch(e){
    alert("Gagal menyimpan perubahan:\n"+e.message);
  }
}

async function deleteProduct(id){
  const p=products.find(x=>String(x.id)===String(id));
  if(!p)return;

  if(!confirm("Hapus produk '"+p.name+"'?"))return;

  const {error}=await db.from("products").delete().eq("id",id);
  if(error){
    alert("Gagal menghapus:\n"+error.message);
    return;
  }

  alert("Produk berhasil dihapus ✅");
  await loadProducts();
}

checkSession();
</script>
</body>
</html>
